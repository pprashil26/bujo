<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Minimal Offline Bullet Journal</title>
  <meta name="description" content="A 1-page, offline-first notepad + todo." />

  <style>
    :root {
      --bg: #e5e5e5;
      --paper: #ffffff;
      --fg: #0000FF;
      --muted: #6b6bdb;
      --caret: #0000FF;
      --shadow: rgba(0,0,0,0.15);
      --line: rgba(0,0,0,0.06);

      --sidebarW: 220px;
      --sidebarTabW: 28px;
      --sidebarFontSize: 0.7rem;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 12px;
    }

    .wrap { display: flex; gap: 10px; }

    .paper {
      width: 148mm;
      min-height: 210mm;
      background: var(--paper);
      box-shadow: 0 10px 30px var(--shadow);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 6px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 2px 4px;
      line-height: 1;
    }

    textarea {
      flex: 1;
      border: none;
      resize: none;
      outline: none;
      padding: 10px 12px;
      background: transparent;
      color: var(--fg);
      caret-color: var(--caret);
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1.4;
      font-family: inherit;
    }

    .sidebar {
      width: var(--sidebarW);
      background: var(--paper);
      box-shadow: 0 10px 30px var(--shadow);
      display: flex;
      flex-direction: column;
      transition: width 160ms;
      font-size: var(--sidebarFontSize);
      font-weight: 400;
    }

    .sidebar.collapsed { width: var(--sidebarTabW); }

    .side-header {
      padding: 6px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      align-items: center;
      gap: 8px;
    }

    .todo {
      flex: 1;
      border: none;
      resize: none;
      outline: none;
      background: transparent;
      padding: 8px;
      font-size: var(--sidebarFontSize);
      font-weight: 400;
      line-height: 1.3;
      font-family: inherit;
    }

    .side-footer {
      padding: 6px;
      border-top: 1px solid var(--line);
      font-size: 0.65rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="paper">
      <header>
        <span id="date"></span>
        <span>
          <button class="btn" id="todoToggle">Todo</button>
          <button class="btn" id="copyAll">Copy</button>
          <button class="btn" id="exportAll">Export</button>
        </span>
      </header>
      <textarea id="editor">• </textarea>
    </div>

    <aside class="sidebar collapsed" id="sidebar">
      <div class="side-header">
        <span>TODO</span>
        <button class="btn" id="sideBtn">≡</button>
      </div>
      <textarea id="todo" class="todo">• </textarea>
      <div class="side-footer">
        <span>Local</span>
        <button class="btn" id="todoCopy">Copy</button>
      </div>
    </aside>
  </div>

<script>
  /* ---------- VERSION ---------- */
  const VERSION_KEY = 'bujo:version';
  const APP_VERSION = '2.0.0'; // switched to continuous notepad key
  if (localStorage.getItem(VERSION_KEY) !== APP_VERSION) {
    localStorage.setItem(VERSION_KEY, APP_VERSION);
  }

  /* ---------- REQUEST PERSISTENT STORAGE (helps on iOS PWA) ---------- */
  (async function requestPersistentStorage() {
    try {
      if (navigator.storage?.persisted && navigator.storage?.persist) {
        const already = await navigator.storage.persisted();
        if (!already) await navigator.storage.persist();
      }
    } catch (_) {}
  })();

  /* ---------- ELEMENTS ---------- */
  const editor     = document.getElementById('editor');
  const todo       = document.getElementById('todo');
  const dateEl     = document.getElementById('date');
  const sidebar    = document.getElementById('sidebar');

  const todoToggle = document.getElementById('todoToggle');
  const sideBtn    = document.getElementById('sideBtn');
  const copyAll    = document.getElementById('copyAll');
  const todoCopy   = document.getElementById('todoCopy');
  const exportAll  = document.getElementById('exportAll');

  /* ---------- STABLE KEYS (NO DATE) ---------- */
  const noteKey = 'bujo:notepad';
  const todoKey = 'bujo-todo';

  /* ---------- SNAPSHOT KEYS (extra safety across future updates) ---------- */
  const lastNoteKey = 'bujo:lastNotepad';
  const lastTodoKey = 'bujo:lastTodo';

  /* ---------- OPTIONAL LEGACY RESCUE (from older date-based versions) ---------- */
  // If you previously used date keys bujo-YYYY-MM-DD, this can pull the most recent one
  // ONCE, to avoid “my old notes vanished after update”.
  (function rescueFromOldKeysOnce() {
    const doneKey = 'bujo:migratedToNotepad';
    if (localStorage.getItem(doneKey)) return;

    // find all old journal keys like bujo-YYYY-MM-DD
    const keys = Object.keys(localStorage).filter(k => /^bujo-\d{4}-\d{2}-\d{2}$/.test(k));
    if (keys.length) {
      keys.sort(); // YYYY-MM-DD sorts correctly
      const latestKey = keys[keys.length - 1];
      const old = localStorage.getItem(latestKey);
      if (old && !localStorage.getItem(noteKey)) {
        localStorage.setItem(noteKey, old);
        localStorage.setItem(lastNoteKey, old);
      }
    }
    localStorage.setItem(doneKey, '1');
  })();

  /* ---------- LOAD (never overwrites) ---------- */
  editor.value =
    localStorage.getItem(noteKey) ??
    localStorage.getItem(lastNoteKey) ??
    '• ';

  todo.value =
    localStorage.getItem(todoKey) ??
    localStorage.getItem(lastTodoKey) ??
    '• ';

  /* ---------- SAVE (ALWAYS) ---------- */
  function saveNote() {
    localStorage.setItem(noteKey, editor.value);
    localStorage.setItem(lastNoteKey, editor.value);
  }

  function saveTodo() {
    localStorage.setItem(todoKey, todo.value);
    localStorage.setItem(lastTodoKey, todo.value);
  }

  ['input','keyup','change','paste','cut','compositionend'].forEach(evt => {
    editor.addEventListener(evt, saveNote, { passive: true });
    todo.addEventListener(evt, saveTodo, { passive: true });
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { saveNote(); saveTodo(); }
  });
  window.addEventListener('pagehide', () => { saveNote(); saveTodo(); });
  window.addEventListener('beforeunload', () => { saveNote(); saveTodo(); });

  /* ---------- HELPERS (indent + bullets) ---------- */
  function getLineStart(text, pos) {
    return text.lastIndexOf('\n', pos - 1) + 1;
  }
  function getIndent(text, lineStart) {
    const match = text.slice(lineStart).match(/^[ \t]*/);
    return match ? match[0] : '';
  }

  function indentHandler(el, saveFn) {
    el.addEventListener('keydown', e => {
      if (e.key === 'Tab') {
        e.preventDefault();

        const start = el.selectionStart;
        const text = el.value;
        const lineStart = getLineStart(text, start);

        if (e.shiftKey) {
          if (text.startsWith('  ', lineStart)) {
            el.value = text.slice(0, lineStart) + text.slice(lineStart + 2);
            el.selectionStart = el.selectionEnd = Math.max(lineStart, start - 2);
          }
        } else {
          el.value = text.slice(0, lineStart) + '  ' + text.slice(lineStart);
          el.selectionStart = el.selectionEnd = start + 2;
        }

        saveFn();
      }
    });
  }

  function bullet(el, saveFn) {
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();

        const pos = el.selectionStart;
        const text = el.value;
        const lineStart = getLineStart(text, pos);
        const indent = getIndent(text, lineStart);

        const insertion = '\n' + indent + '• ';
        el.value = text.slice(0, pos) + insertion + text.slice(pos);
        el.selectionStart = el.selectionEnd = pos + insertion.length;

        saveFn();
      }
    });

    indentHandler(el, saveFn);
  }

  bullet(editor, saveNote);
  bullet(todo, saveTodo);

  /* ---------- DATE DISPLAY (display-only; no storage impact) ---------- */
  dateEl.textContent = new Date().toDateString();

  /* ---------- COPY ---------- */
  copyAll.onclick  = () => navigator.clipboard.writeText(editor.value);
  todoCopy.onclick = () => navigator.clipboard.writeText(todo.value);

  /* ---------- EXPORT ---------- */
  exportAll.onclick = () => {
    const blob = new Blob([editor.value], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `bujo-notepad.txt`;
    a.click();
    URL.revokeObjectURL(url);
  };

  /* ---------- SIDEBAR ---------- */
  const toggle = () => sidebar.classList.toggle('collapsed');
  todoToggle.onclick = toggle;
  sideBtn.onclick = toggle;
</script>
</body>
</html>
