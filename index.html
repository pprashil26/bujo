<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Minimal Offline Bullet Journal</title>
  <meta name="description" content="A 1-page, offline-first Bullet Journal web app." />

  <style>
    :root {
      --bg:#e5e5e5; --paper:#fff; --fg:#0000FF;
      --muted:#6b6bdb; --caret:#0000FF;
      --shadow:rgba(0,0,0,.15); --line:rgba(0,0,0,.06);
      --sidebarW:220px; --sidebarTabW:28px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0b0b0b; --paper:#111; --fg:#0000FF;
        --muted:#7f7fff; --caret:#0000FF;
        --shadow:rgba(0,0,0,.4); --line:rgba(255,255,255,.1);
      }
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:var(--bg); color:var(--fg);
      font-family:system-ui,sans-serif;
      display:flex; justify-content:center; padding:24px 12px;
    }
    .wrap{display:flex; gap:10px; align-items:flex-start}
    .paper{
      width:148mm; min-height:210mm; background:var(--paper);
      box-shadow:0 10px 30px var(--shadow); display:flex;
      flex-direction:column;
    }
    header{
      padding:6px 8px; font-size:.75rem; font-weight:600;
      color:var(--muted); border-bottom:1px solid var(--line);
      display:flex; justify-content:space-between;
    }
    .btn{
      border:none; background:none; color:var(--muted);
      font-size:.75rem; cursor:pointer;
    }
    textarea{
      flex:1; border:none; resize:none; outline:none;
      padding:10px 12px; background:none; color:var(--fg);
      caret-color:var(--caret); font-size:.95rem;
      font-weight:700; line-height:1.4;
    }
    .sidebar{
      width:var(--sidebarW); background:var(--paper);
      box-shadow:0 10px 30px var(--shadow);
      display:flex; flex-direction:column;
      transition:width .15s;
    }
    .sidebar.collapsed{width:var(--sidebarTabW)}
    .side-header{
      padding:6px; display:flex; justify-content:space-between;
      border-bottom:1px solid var(--line);
    }
    .sidebar.collapsed textarea,
    .sidebar.collapsed .side-footer{display:none}
    .side-footer{
      padding:6px; font-size:.7rem;
      border-top:1px solid var(--line);
      display:flex; justify-content:space-between;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="paper">
      <header>
        <span id="date"></span>
        <span>
          <button class="btn" id="todoToggle">Todo</button>
          <button class="btn" id="copyAll">Copy</button>
        </span>
      </header>
      <textarea id="editor" placeholder="• Start logging..."></textarea>
    </div>

    <aside class="sidebar collapsed" id="sidebar">
      <div class="side-header">
        <strong>TODO</strong>
        <button class="btn" id="sideBtn">≡</button>
      </div>
      <textarea id="todo" placeholder="• Todo..."></textarea>
      <div class="side-footer">
        <span>Local</span>
        <button class="btn" id="todoCopy">Copy</button>
      </div>
    </aside>
  </div>

<script>
  const today = () => new Date().toISOString().slice(0,10);
  const journalKey = 'bujo-' + today();
  const legacyKey = 'bujo';
  const todoKey = 'bujo-todo';

  const editor = document.getElementById('editor');
  const todo = document.getElementById('todo');
  const sidebar = document.getElementById('sidebar');

  document.getElementById('date').textContent = new Date().toDateString();

  editor.value =
    localStorage.getItem(journalKey) ??
    localStorage.getItem(legacyKey) ?? '• ';

  todo.value = localStorage.getItem(todoKey) ?? '• ';

  editor.addEventListener('input',()=>localStorage.setItem(journalKey,editor.value));
  todo.addEventListener('input',()=>localStorage.setItem(todoKey,todo.value));

  function bullet(el,key){
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        const s=el.selectionStart;
        el.value = el.value.slice(0,s) + '\\n• ' + el.value.slice(s);
        el.selectionStart = el.selectionEnd = s+3;
        localStorage.setItem(key,el.value);
      }
    });
  }
  bullet(editor,journalKey); bullet(todo,todoKey);

  document.getElementById('copyAll').onclick=()=>navigator.clipboard.writeText(editor.value);
  document.getElementById('todoCopy').onclick=()=>navigator.clipboard.writeText(todo.value);

  const toggle=()=>sidebar.classList.toggle('collapsed');
  document.getElementById('todoToggle').onclick=toggle;
  document.getElementById('sideBtn').onclick=toggle;
</script>
</body>
</html>
