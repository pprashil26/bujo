<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Minimal Offline Bullet Journal</title>
  <meta name="description" content="A 1-page, offline-first Bullet Journal web app." />

  <style>
    :root {
      --bg: #e5e5e5;
      --paper: #ffffff;
      --fg: #0000FF;
      --muted: #6b6bdb;
      --caret: #0000FF;
      --shadow: rgba(0,0,0,0.15);
      --line: rgba(0,0,0,0.06);

      --sidebarW: 220px;
      --sidebarTabW: 28px;
      --sidebarFontSize: 0.7rem;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 12px;
    }

    .wrap { display: flex; gap: 10px; }

    .paper {
      width: 148mm;
      min-height: 210mm;
      background: var(--paper);
      box-shadow: 0 10px 30px var(--shadow);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 6px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
    }

    .btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.75rem;
    }

    textarea {
      flex: 1;
      border: none;
      resize: none;
      outline: none;
      padding: 10px 12px;
      background: transparent;
      color: var(--fg);
      caret-color: var(--caret);
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.4;
      font-family: inherit;
    }

    .sidebar {
      width: var(--sidebarW);
      background: var(--paper);
      box-shadow: 0 10px 30px var(--shadow);
      display: flex;
      flex-direction: column;
      transition: width 160ms;
      font-size: var(--sidebarFontSize);
      font-weight: 400;
    }

    .sidebar.collapsed { width: var(--sidebarTabW); }

    .side-header {
      padding: 6px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      color: var(--muted);
    }

    .todo {
      flex: 1;
      border: none;
      resize: none;
      background: transparent;
      padding: 8px;
      font-size: var(--sidebarFontSize);
    }

    .side-footer {
      padding: 6px;
      border-top: 1px solid var(--line);
      font-size: 0.65rem;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="paper">
      <header>
        <span id="date"></span>
        <span>
          <button class="btn" id="todoToggle">Todo</button>
          <button class="btn" id="copyAll">Copy</button>
          <button class="btn" id="exportAll">Export</button>
        </span>
      </header>
      <textarea id="editor">• </textarea>
    </div>

    <aside class="sidebar collapsed" id="sidebar">
      <div class="side-header">
        <span>TODO</span>
        <button class="btn" id="sideBtn">≡</button>
      </div>
      <textarea id="todo" class="todo">• </textarea>
      <div class="side-footer">
        <span>Local</span>
        <button class="btn" id="todoCopy">Copy</button>
      </div>
    </aside>
  </div>

<script>
  /* ---------- VERSION ---------- */
  const VERSION_KEY = 'bujo:version';
  const APP_VERSION = '1.0.0';
  if (localStorage.getItem(VERSION_KEY) !== APP_VERSION) {
    localStorage.setItem(VERSION_KEY, APP_VERSION);
  }

  /* ---------- KEYS ---------- */
  const today = new Date().toISOString().slice(0,10);
  const journalKey = 'bujo-' + today;
  const todoKey = 'bujo-todo';

  editor.value = localStorage.getItem(journalKey) ?? '• ';
  todo.value   = localStorage.getItem(todoKey)   ?? '• ';

  editor.oninput = () => localStorage.setItem(journalKey, editor.value);
  todo.oninput   = () => localStorage.setItem(todoKey, todo.value);

  /* ---------- HELPERS ---------- */
  function getLineStart(text, pos) {
    return text.lastIndexOf('\n', pos - 1) + 1;
  }

  function getIndent(text, lineStart) {
    const match = text.slice(lineStart).match(/^[ \t]*/);
    return match ? match[0] : '';
  }

  function indentHandler(el, key) {
    el.addEventListener('keydown', e => {
      if (e.key === 'Tab') {
        e.preventDefault();

        const start = el.selectionStart;
        const text = el.value;
        const lineStart = getLineStart(text, start);

        if (e.shiftKey) {
          if (text.startsWith('  ', lineStart)) {
            el.value =
              text.slice(0, lineStart) +
              text.slice(lineStart + 2);
            el.selectionStart = el.selectionEnd = start - 2;
          }
        } else {
          el.value =
            text.slice(0, lineStart) +
            '  ' +
            text.slice(lineStart);
          el.selectionStart = el.selectionEnd = start + 2;
        }

        localStorage.setItem(key, el.value);
      }
    });
  }

  /* ---------- BULLET + AUTO‑INDENT ---------- */
  function bullet(el, key) {
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();

        const pos = el.selectionStart;
        const text = el.value;
        const lineStart = getLineStart(text, pos);
        const indent = getIndent(text, lineStart);

        const insertion = '\n' + indent + '• ';
        el.value = text.slice(0, pos) + insertion + text.slice(pos);
        el.selectionStart = el.selectionEnd = pos + insertion.length;

        localStorage.setItem(key, el.value);
      }
    });

    indentHandler(el, key);
  }

  bullet(editor, journalKey);
  bullet(todo, todoKey);

  /* ---------- DATE ---------- */
  date.textContent = new Date().toDateString();

  /* ---------- COPY ---------- */
  copyAll.onclick  = () => navigator.clipboard.writeText(editor.value);
  todoCopy.onclick = () => navigator.clipboard.writeText(todo.value);

  /* ---------- EXPORT ---------- */
  exportAll.onclick = () => {
    const blob = new Blob([editor.value], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `bujo-${today}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  };

  /* ---------- SIDEBAR ---------- */
  const toggle = () => sidebar.classList.toggle('collapsed');
  todoToggle.onclick = toggle;
  sideBtn.onclick = toggle;
</script>
</body>
</html>
