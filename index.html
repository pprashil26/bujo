<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Minimal Offline Bullet Journal</title>
  <meta name="description" content="A 1-page, offline-first Bullet Journal web app. No sync. No accounts. Just write." />

  <style>
    :root {
      --bg: #e5e5e5;          /* desk background */
      --paper: #ffffff;      /* paper */
      --fg: #0000FF;         /* default text color */
      --muted: #6b6bdb;      /* muted blue for date/placeholder */
      --caret: #0000FF;      /* caret color */
      --shadow: rgba(0, 0, 0, 0.15);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0b0b;
        --paper: #111111;
        --fg: #0000FF;
        --muted: #7f7fff;
        --caret: #0000FF;
        --shadow: rgba(0, 0, 0, 0.4);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 12px;
    }

    /* A5 paper container */
    .paper {
      width: 148mm;
      min-height: 210mm;
      background: var(--paper);
      box-shadow: 0 10px 30px var(--shadow);
      border-radius: 2px;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 6px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      user-select: none;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    @media (prefers-color-scheme: dark) {
      header {
        border-bottom-color: rgba(255, 255, 255, 0.08);
      }
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 4px;
    }

    .copy-btn:active {
      opacity: 0.6;
    }

    textarea {
      flex: 1;
      width: 100%;
      padding: 10px 12px 14px;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--fg);
      caret-color: var(--caret);
      font-size: 0.95rem;
      font-weight: 700; /* bold by default */
      line-height: 1.4;
      font-family: inherit;
    }

    textarea::placeholder {
      color: var(--muted);
      font-weight: 600;
    }

    /* Mobile: allow paper to scale */
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      .paper {
        width: 100%;
        min-height: calc(100vh - 24px);
      }
    }
  </style>
</head>

<body>
  <div class="paper">
    <header>
      <span id="date"></span>
      <button class="copy-btn" id="copyAll" title="Copy all">Copy</button>
    </header>

    <textarea
      id="editor"
      spellcheck="false"
      placeholder="• Start logging..."
    ></textarea>
  </div>

  <script>
    // ----- Helpers -----
    function getTodayKey() {
      return new Date().toISOString().slice(0, 10); // YYYY-MM-DD
    }

    function formatDate() {
      return new Date().toDateString();
    }

    // ----- Elements -----
    const editor = document.getElementById("editor");
    const dateEl = document.getElementById("date");
    const copyBtn = document.getElementById("copyAll");

    const storageKey = "bujo-" + getTodayKey();

    // ----- Init -----
    dateEl.textContent = formatDate();

    const saved = localStorage.getItem(storageKey);
    editor.value = saved ? saved : "• ";
    editor.focus();

    // ----- Autosave -----
    editor.addEventListener("input", () => {
      localStorage.setItem(storageKey, editor.value);
    });

    // ----- Bullet on Enter -----
    editor.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();

        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const value = editor.value;
        const insertion = "\n• ";

        editor.value = value.slice(0, start) + insertion + value.slice(end);
        editor.selectionStart = editor.selectionEnd = start + insertion.length;

        localStorage.setItem(storageKey, editor.value);
      }

      if (e.key === "Tab") e.preventDefault();
    });

    // ----- Copy All Content -----
    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(editor.value);
        copyBtn.textContent = "Copied";
        setTimeout(() => (copyBtn.textContent = "Copy"), 1000);
      } catch {
        editor.select();
        document.execCommand("copy");
        copyBtn.textContent = "Copied";
        setTimeout(() => (copyBtn.textContent = "Copy"), 1000);
      }
    });
  </script>
</body>
</html>
